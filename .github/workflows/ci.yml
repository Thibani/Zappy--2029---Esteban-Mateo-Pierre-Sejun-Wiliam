name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Dependencies (C/C++)
      # =========================
      - name: Install base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make cppcheck cmake git \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git
          cd raylib && mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF
          sudo make install

      - name: Install Criterion
        run: |
          sudo apt-get install -y meson ninja-build pkg-config libffi-dev \
            libgit2-dev
          git clone --depth 1 https://github.com/Snaipe/Criterion.git
          cd Criterion
          meson setup build
          cd build
          ninja
          sudo ninja install
          sudo ldconfig

      # =========================
      # C / C++ Build
      # =========================
      - name: Build C/C++ project
        run: make zappy_server zappy_gui zappy_ai

      # =========================
      # cppcheck static analysis
      # =========================
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            server/src
          cppcheck --enable=all --error-exitcode=1 \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            gui/src

      # =========================
      # Unit tests (Criterion)
      # =========================
      - name: Run server unit tests
        run: make test

      # =========================
      # Rust (if exists)
      # =========================
      - name: Setup Rust (if needed)
        run: |
          if [ -f Cargo.toml ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Build Rust project
        run: |
          if [ -f Cargo.toml ]; then
            cargo build --verbose
          else
            echo "No Rust project found"
          fi

      - name: Run Rust tests
        run: |
          if [ -f Cargo.toml ]; then
            cargo test --verbose
          fi

      # =========================
      # Python (if exists)
      # =========================
      - name: Setup Python (if needed)
        run: |
          if ls *.py 1> /dev/null 2>&1 || [ -f requirements.txt ]; then
            sudo apt-get install -y python3 python3-pip
          fi

      - name: Install Python deps
        run: |
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt
          fi

      - name: Run Python tests
        run: |
          if command -v pytest >/dev/null 2>&1 || [ -d tests ]; then
            pip3 install pytest
            pytest -q || true
          else
            echo "No Python tests found"
          fi

  mirror-to-epitech:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'Thibani/Zappy--2029---Esteban-Mateo-Pierre-Sejun-Wiliam'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EPITECH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Epitech
        run: |
          git remote add epitech git@github.com:EpitechPGE2-2025/G-YEP-400-STG-4-1-zappy-2.git
          git push --mirror epitech